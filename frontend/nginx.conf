server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # NOTE: /warden/report (public intake) is proxied; /warden/reports (the TRIAGE QUEUE) is
    # deliberately NOT. The queue holds unverified accusations against named third parties, so
    # publishing it would broadcast unproven claims about other people's services and hand any
    # stranger a griefing tool. It is operator-token gated in the backend as well.

    # ── Resolve the backend at REQUEST time, not at startup ───────────────────
    # nginx resolves an upstream hostname ONCE when the config loads and caches the address forever.
    # Every `docker compose up -d momus-backend` gives that container a new IP, so after any backend
    # redeploy this nginx kept proxying to a dead address and the whole public API surface answered
    # 502 — silently, because the static landing still served fine. Found on production: /health was
    # 502 at the edge while the backend answered 200 to its own container name.
    #
    # Docker's embedded DNS is at 127.0.0.11. Putting the upstream in a VARIABLE is what forces
    # nginx to re-resolve per request instead of freezing the address at load time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $momus_backend "momus-backend:9400";

    # ── Same-origin API bridge ────────────────────────────────────────────────
    # /bulletin* is here for a reason worth stating: the signed advisory index IS the
    # public record, and a consumer that cannot fetch it has no record. It was missing,
    # so momus.modelmarket.dev/bulletin returned the SPA's index.html and DIOSCURI's
    # publisher refused it as UNPARSEABLE — the feature was live and unreachable.
    # Publishing/withdrawing stays out: those are operator acts with no HTTP route at all.
    # In production the SPA calls the API on its own origin (src/api.ts uses an empty base URL),
    # so these paths are proxied to the MOMUS backend over the shared Docker network.
    #
    # READ-ONLY only. Anything that makes MOMUS *act* — /scan, /selfaudit, /retest, /remediate,
    # /intel/refresh, /a2a/tasks — is deliberately NOT proxied here, so it is unreachable from the
    # public edge at all. Those routes are additionally operator-token gated in the backend
    # (momus/app.py::_require_operator), which is the authoritative check; this block is the second
    # layer, so a future config slip in one place does not open the other. Nothing here can reach
    # the Treasury: payouts live in a separate service on a separate key and are never proxied.
    location ~ ^/(health|providers|findings|intel|warden/threat-feed(/summary)?|warden/report|bulletin|bulletin\.atom|bulletin/osv|bulletin/[A-Za-z0-9._-]+)$ {
        proxy_pass http://$momus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Preserve the ORIGINAL client. Setting $remote_addr here overwrote whatever the TLS edge
        # had put in X-Real-IP, so oracle-core's client_key saw one address for the whole internet
        # and every public caller shared a single rate-limit bucket — one client could 429 everyone.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Public marketplace surface: the signed manifest, discovery, the A2A agent card, and a
    # completed scan report by id. All read-only.
    location ~ ^/(scan/[A-Za-z0-9._-]+|\.well-known/[A-Za-z0-9._-]+|ai-market/v2/(manifest|invoke))$ {
        proxy_pass http://$momus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Preserve the ORIGINAL client. Setting $remote_addr here overwrote whatever the TLS edge
        # had put in X-Real-IP, so oracle-core's client_key saw one address for the whole internet
        # and every public caller shared a single rate-limit bucket — one client could 429 everyone.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Control plane: refused at the edge. Operators reach it on the host (loopback :9410) with the
    # operator token, not through the public site.
    location ~ ^/(scan|selfaudit|retest|remediate|intel/refresh|a2a/tasks)$ {
        return 404;
    }
}
