# MOMUS CI — the full unit suite. No live network: every probe/target in the tests is a local
# fixture, so a green run here means the logic holds, not that some service happened to be up.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [[ -d vendor/oracle-core ]]; then
            pip install -e vendor/oracle-core -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi
      - name: Fetch SKOPOS, WARDEN and HISTOR beside the checkout (the quality-cycle tests read them)
        # SKOPOS signs the deploy orders; WARDEN and HISTOR must ship the same release gate and key.
        run: |
          git clone --no-checkout https://github.com/alexar76/skopos.git "$GITHUB_WORKSPACE/../skopos"
          git -C "$GITHUB_WORKSPACE/../skopos" checkout 38a44c00ccd8a092693d7e6b7e9de8d3e4a2f360  # alexar76/skopos main, 2026-11-07
          git clone --no-checkout https://github.com/alexar76/warden.git "$GITHUB_WORKSPACE/../warden"
          git -C "$GITHUB_WORKSPACE/../warden" checkout 147a6fe8b4b1f84013c29cd4d7f27889a5a4edd7  # alexar76/warden main, 2026-11-07
          git clone --no-checkout https://github.com/alexar76/histor.git "$GITHUB_WORKSPACE/../histor"
          git -C "$GITHUB_WORKSPACE/../histor" checkout 757dd3a5c0ffefffa86b46a4e4a7d00be489ad36  # alexar76/histor main, 2026-11-07
      - name: Pytest
        run: pytest -q --tb=short
